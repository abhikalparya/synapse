services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - SYNAPSE_DB_PATH=/app/backend/data/synapse.db
      - SYNAPSE_PROPOSAL_EVENTS_PATH=/app/backend/data/proposal_events.jsonl
    volumes:
      - synapse_data:/app/backend/data
      - synapse_raw_notes:/app/backend/raw_notes
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/graph', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  synapse_data:
  synapse_raw_notes:
  frontend_node_modules:
